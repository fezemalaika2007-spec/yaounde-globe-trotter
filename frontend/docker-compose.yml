services:
  globetrotter-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globetrotter-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
