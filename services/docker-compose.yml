version: "3.9"

# Phase 2 Microservices Architecture
# --------------------------------
# Three independent services + API Gateway on a shared Docker network.
# Each service connects to its own online PostgreSQL database (Neon),
# configured via the DATABASE_URL environment variable. No local database
# containers are used — the databases live online.
#
# Set these in a .env file (never committed):
#   DATABASE_URL=postgresql://<user>:<password>@<host>/<dbname>?sslmode=require
#   FOURSQUARE_API_KEY=<your_foursquare_key>

services:

  # --- User Service (port 5001) ---
  # Owns: user registration, login, JWT generation, user preferences
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_URL=${USER_DATABASE_URL:-${DATABASE_URL}}
    networks:
      - globetrotter-net

  # --- Itinerary Service (port 5002) ---
  # Owns: itinerary CRUD, user-specific itinerary lists
  itinerary-service:
    build: ./itinerary-service
    container_name: itinerary-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_URL=${ITINERARY_DATABASE_URL:-${DATABASE_URL}}
    networks:
      - globetrotter-net

  # --- Recommendation Service (port 5003) ---
  # Owns: destinations (Foursquare-driven), ratings, recommendations
  # Has outbound internet access for Foursquare API calls
  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_URL=${RECOMMENDATION_DATABASE_URL:-${DATABASE_URL}}
      - FOURSQUARE_API_KEY=${FOURSQUARE_API_KEY}
      - USER_SERVICE_URL=http://user-service:5001
    networks:
      - globetrotter-net

  # --- API Gateway (port 5000) ---
  # Single public entry point. Routes requests to the correct service.
  # Contains NO business logic.
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
    networks:
      - globetrotter-net

networks:
  globetrotter-net:
    driver: bridge
