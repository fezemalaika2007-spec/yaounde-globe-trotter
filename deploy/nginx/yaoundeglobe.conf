# Keep IP-based API access separate from the domain's Certbot HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name 185.202.223.228;

    client_max_body_size 25m;

    # Old cached builds used this malformed prefix. Preserve POST bodies.
    location ^~ /apidocker/ {
        rewrite ^/apidocker/(.*)$ /api/$1 last;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
