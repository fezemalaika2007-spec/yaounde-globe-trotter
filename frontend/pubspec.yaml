name: yaounde_trip
description: "Yaounde.Trip — Smart travel planner for Yaoundé, Cameroon and beyond"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  url_launcher: ^6.2.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth/
    - assets/images/home/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-mediumitalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/roboto-bolditalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/roboto-black.ttf
          weight: 900
