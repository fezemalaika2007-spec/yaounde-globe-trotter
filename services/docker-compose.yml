version: "3.9"

# Phase 2 Microservices Architecture
# --------------------------------
# Three independent services + API Gateway on a shared Docker network.
# Each service has its own SQLite database (no shared DB access).
# All services communicate through the API Gateway on port 5000.

services:

  # --- User Service (port 5001) ---
  # Owns: user registration, login, JWT generation, user preferences
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    volumes:
      - user-db:/user-service/database
    environment:
      - PORT=5001
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_PATH=/user-service/database/users.db
    networks:
      - globetrotter-net

  # --- Itinerary Service (port 5002) ---
  # Owns: itinerary CRUD, user-specific itinerary lists
  itinerary-service:
    build: ./itinerary-service
    container_name: itinerary-service
    ports:
      - "5002:5002"
    volumes:
      - itinerary-db:/itinerary-service/database
    environment:
      - PORT=5002
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_PATH=/itinerary-service/database/itineraries.db
    networks:
      - globetrotter-net

  # --- Recommendation Service (port 5003) ---
  # Owns: destinations (Overpass-driven), ratings, recommendations
  # Has outbound internet access for Overpass + Wikidata/Wikimedia calls
  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "5003:5003"
    volumes:
      - rec-db:/recommendation-service/database
    environment:
      - PORT=5003
      - SECRET_KEY=${SECRET_KEY:-globetrotter-secret-change-in-prod}
      - DATABASE_PATH=/recommendation-service/database/recommendations.db
    networks:
      - globetrotter-net

  # --- API Gateway (port 5000) ---
  # Single public entry point. Routes requests to the correct service.
  # Contains NO business logic.
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
    networks:
      - globetrotter-net

# --- Named volumes for each service's database ---
volumes:
  user-db:
  itinerary-db:
  rec-db:

networks:
  globetrotter-net:
    driver: bridge
